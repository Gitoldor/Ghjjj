name: Expire Posts

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  expire-posts:
    name: Remove Expired Posts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check required files
        run: |
          echo "Checking files..."

          if [ ! -f "App.js" ]; then
            echo "ERROR: App.js not found."
            exit 1
          fi

          if [ ! -f "expire-posts.js" ]; then
            echo "ERROR: expire-posts.js not found."
            exit 1
          fi

          echo "Required files found."

      - name: Remove expired posts
        run: |
          echo "Starting expiry check..."
          node expire-posts.js

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet App.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No expired posts found."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Expired posts were removed."
          fi

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add App.js

          git commit -m "Automatically remove expired posts"

          git push
