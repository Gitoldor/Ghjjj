name: Expire Posts

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  expire-posts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove expired posts
        run: |
          node <<'EOF'
          const fs = require("fs");

          const file = "App.js";

          const PLAN_DAYS = {
            FREE: 7,
            PRO: 30,
            PREMIUM: 90
          };

          console.log("Reading App.js...");

          let content = fs.readFileSync(file, "utf8");

          /*
           * Read:
           * const posts = [...]
           */
          const match = content.match(
            /const\s+posts\s*=\s*(\[[\s\S]*\]);?\s*$/
          );

          if (!match) {
            console.error("Could not find posts array in App.js");
            process.exit(1);
          }

          let posts;

          try {
            posts = Function(
              `"use strict"; return ${match[1]}`
            )();
          } catch (error) {
            console.error("Could not parse posts array.");
            console.error(error);
            process.exit(1);
          }

          if (!Array.isArray(posts)) {
            console.error("posts is not an array.");
            process.exit(1);
          }

          const now = new Date();

          console.log(`Posts found: ${posts.length}`);

          const remainingPosts = posts.filter(post => {

            /*
             * No createdAt = never expire
             */
            if (!post.createdAt) {
              console.log(
                `KEEP ${post.id}: no createdAt`
              );
              return true;
            }

            /*
             * Unknown plan = never expire
             */
            const days = PLAN_DAYS[post.plan];

            if (!days) {
              console.log(
                `KEEP ${post.id}: unknown plan "${post.plan}"`
              );
              return true;
            }

            const created = new Date(
              `${post.createdAt}T00:00:00Z`
            );

            if (Number.isNaN(created.getTime())) {
              console.log(
                `KEEP ${post.id}: invalid createdAt`
              );
              return true;
            }

            const expiry = new Date(
              created.getTime() +
              days * 24 * 60 * 60 * 1000
            );

            if (now >= expiry) {
              console.log(
                `DELETE ${post.id}: ${post.plan} expired`
              );
              return false;
            }

            console.log(
              `KEEP ${post.id}: expires ${expiry.toISOString()}`
            );

            return true;
          });

          const deleted =
            posts.length - remainingPosts.length;

          /*
           * Only rewrite App.js if something was deleted.
           */
          if (deleted === 0) {
            console.log("");
            console.log("No expired posts.");
            console.log("App.js will not be changed.");
            process.exit(0);
          }

          const newContent =
`const posts = ${JSON.stringify(
  remainingPosts,
  null,
  2
)};
`;

          fs.writeFileSync(
            file,
            newContent,
            "utf8"
          );

          console.log("");
          console.log("================================");
          console.log("EXPIRY CHECK COMPLETE");
          console.log("================================");
          console.log(`Before:  ${posts.length}`);
          console.log(`Deleted: ${deleted}`);
          console.log(`After:   ${remainingPosts.length}`);
          console.log("================================");
          EOF

      - name: Commit changes
        run: |
          if git diff --quiet -- App.js; then
            echo "Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add App.js

          git commit -m "Automatically remove expired posts"

          git push
