name: Expire Posts

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expire-posts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check and remove expired posts
        run: |
          node -e '
          const fs = require("fs");
          const vm = require("vm");

          const file = "App.js";

          const PLAN_DAYS = {
            FREE: 7,
            PRO: 30,
            PREMIUM: 90
          };

          console.log("================================");
          console.log("POST EXPIRY CHECK");
          console.log("================================");

          if (!fs.existsSync(file)) {
            console.error("ERROR: App.js was not found.");
            process.exit(1);
          }

          const content = fs.readFileSync(file, "utf8");

          const sandbox = {};

          try {
            vm.runInNewContext(
              content + "\nresult = posts;",
              sandbox
            );
          } catch (error) {
            console.error("ERROR: Could not read posts from App.js.");
            console.error(error.message);
            process.exit(1);
          }

          const posts = sandbox.result;

          if (!Array.isArray(posts)) {
            console.error("ERROR: posts is not an array.");
            process.exit(1);
          }

          console.log("Posts found:", posts.length);

          const now = new Date();

          const remainingPosts = [];

          for (const post of posts) {

            if (!post.createdAt) {
              console.log(
                "KEEP:",
                post.id,
                "- no createdAt"
              );

              remainingPosts.push(post);
              continue;
            }

            const days = PLAN_DAYS[post.plan];

            if (!days) {
              console.log(
                "KEEP:",
                post.id,
                "- unknown plan:",
                post.plan
              );

              remainingPosts.push(post);
              continue;
            }

            const created = new Date(
              post.createdAt + "T00:00:00Z"
            );

            if (Number.isNaN(created.getTime())) {
              console.log(
                "KEEP:",
                post.id,
                "- invalid createdAt"
              );

              remainingPosts.push(post);
              continue;
            }

            const expiry = new Date(
              created.getTime() +
              days * 24 * 60 * 60 * 1000
            );

            if (now >= expiry) {
              console.log(
                "DELETE:",
                post.id,
                "|",
                post.plan,
                "|",
                post.createdAt
              );
            } else {
              console.log(
                "KEEP:",
                post.id,
                "| expires:",
                expiry.toISOString()
              );

              remainingPosts.push(post);
            }
          }

          const deleted =
            posts.length - remainingPosts.length;

          console.log("");
          console.log("================================");
          console.log("RESULT");
          console.log("================================");
          console.log("Before:", posts.length);
          console.log("After:", remainingPosts.length);
          console.log("Deleted:", deleted);
          console.log("================================");

          if (deleted === 0) {
            console.log("Nothing expired.");
            console.log("App.js will not be changed.");
            process.exit(0);
          }

          const output =
            "const posts = " +
            JSON.stringify(
              remainingPosts,
              null,
              2
            ) +
            ";\n";

          fs.writeFileSync(
            file,
            output,
            "utf8"
          );

          console.log("App.js updated successfully.");
          '

      - name: Commit changes if needed
        run: |
          if git diff --quiet -- App.js; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add App.js

          git commit -m "Automatically remove expired posts"

          git push
