name: Expire Posts

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expire-posts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove expired posts
        run: |
          python3 - <<'PY'
          import re
          import json
          from datetime import datetime, timedelta, timezone

          FILE = "App.js"

          PLAN_DAYS = {
              "FREE": 7,
              "PRO": 30,
              "PREMIUM": 90
          }

          print("Reading App.js...")

          with open(FILE, "r", encoding="utf-8") as f:
              content = f.read()

          start = content.find("const posts = [")
          end = content.rfind("];")

          if start == -1 or end == -1:
              print("ERROR: Could not find posts array in App.js")
              raise SystemExit(1)

          array_text = content[start + len("const posts = "):end + 1]

          try:
              posts = json.loads(array_text)
          except Exception as error:
              print("ERROR: App.js posts array is not valid JSON.")
              print(error)
              raise SystemExit(1)

          if not isinstance(posts, list):
              print("ERROR: posts is not an array.")
              raise SystemExit(1)

          now = datetime.now(timezone.utc)

          remaining = []

          for post in posts:
              post_id = post.get("id")
              plan = post.get("plan")
              created_at = post.get("createdAt")

              if not created_at:
                  print(f"KEEP {post_id}: no createdAt")
                  remaining.append(post)
                  continue

              days = PLAN_DAYS.get(plan)

              if not days:
                  print(f"KEEP {post_id}: unknown plan {plan}")
                  remaining.append(post)
                  continue

              try:
                  created = datetime.strptime(
                      created_at,
                      "%Y-%m-%d"
                  ).replace(tzinfo=timezone.utc)
              except Exception:
                  print(f"KEEP {post_id}: invalid createdAt")
                  remaining.append(post)
                  continue

              expiry = created + timedelta(days=days)

              if now >= expiry:
                  print(
                      f"DELETE {post_id}: "
                      f"{plan} expired on {expiry.isoformat()}"
                  )
              else:
                  print(
                      f"KEEP {post_id}: "
                      f"expires on {expiry.isoformat()}"
                  )
                  remaining.append(post)

          deleted = len(posts) - len(remaining)

          print("")
          print("================================")
          print("EXPIRY CHECK COMPLETE")
          print("================================")
          print(f"Posts before: {len(posts)}")
          print(f"Posts after:  {len(remaining)}")
          print(f"Deleted:      {deleted}")
          print("================================")

          if deleted == 0:
              print("No expired posts.")
              raise SystemExit(0)

          new_content = (
              "const posts = "
              + json.dumps(
                  remaining,
                  indent=2,
                  ensure_ascii=False
              )
              + ";\n"
          )

          with open(FILE, "w", encoding="utf-8") as f:
              f.write(new_content)

          print("App.js updated successfully.")
          PY

      - name: Commit changes
        run: |
          if git diff --quiet -- App.js; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add App.js
          git commit -m "Automatically remove expired posts"
          git push
