<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Realtime Canvas Notes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#111}
body{background:#e9eaed}
#app{width:100vw;height:100vh;position:relative;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none;background-color:#f4f5f7;background-image:radial-gradient(#cfd2d7 1px,transparent 1px);background-size:24px 24px}
canvas.dragging{cursor:grabbing}
.topbar{position:absolute;z-index:5;top:18px;left:18px;right:18px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.brand,.tools{pointer-events:auto;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border:1px solid rgba(0,0,0,.08);box-shadow:0 8px 30px rgba(0,0,0,.08);border-radius:16px}
.brand{padding:12px 16px;font-weight:800}
.tools{display:flex;gap:8px;padding:7px}
button{border:0;background:#fff;padding:9px 12px;border-radius:10px;font-weight:700;cursor:pointer}
button:hover{background:#f0f1f3}
.primary{background:#111;color:#fff}.primary:hover{background:#222}
.status{position:absolute;z-index:5;bottom:18px;left:18px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);font-size:12px;box-shadow:0 5px 20px rgba(0,0,0,.08)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#999;margin-right:6px}
.live .dot{background:#20a05a}
.hint{position:absolute;z-index:4;bottom:18px;right:18px;padding:8px 12px;background:rgba(255,255,255,.8);border-radius:10px;font-size:12px;color:#666}
.modal{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.box{width:min(540px,100%);background:white;border-radius:20px;padding:22px;box-shadow:0 20px 70px rgba(0,0,0,.2)}
.box h2{margin:0 0 18px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit;outline:none}
textarea{min-height:170px;resize:vertical}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:absolute;z-index:30;bottom:60px;left:50%;transform:translateX(-50%);background:#111;color:white;padding:10px 14px;border-radius:10px;display:none;font-size:13px}
.toast.show{display:block}
</style>
</head>
<body>
<div id="app">
<canvas id="canvas"></canvas>

<div class="topbar">
  <div class="brand">🧠 Canvas Notes</div>
  <div class="tools">
    <button class="primary" id="addBtn">＋ Note</button>
    <button id="resetBtn">Reset view</button>
  </div>
</div>

<div id="status" class="status"><span class="dot"></span><span id="statusText">Connecting…</span></div>
<div class="hint">Drag notes • Drag empty canvas to pan • Double-click canvas to add</div>

<div id="modal" class="modal">
  <div class="box">
    <h2 id="modalTitle">New note</h2>
    <form id="form">
      <input id="noteId" type="hidden">
      <label>Title</label>
      <input id="title" maxlength="120" required>
      <label>Content</label>
      <textarea id="content" required></textarea>
      <div class="actions">
        <button type="button" id="cancel">Cancel</button>
        <button class="primary" type="submit">Save</button>
      </div>
    </form>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
const SUPABASE_URL="https://okwuinixzdysdkuamgtu.supabase.co";
const SUPABASE_KEY="sb_publishable_CPVPATJCw13WRHEMulcERA_tNoN45sG";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d");
const status=document.getElementById("status"),statusText=document.getElementById("statusText");
const modal=document.getElementById("modal"),form=document.getElementById("form");
const titleEl=document.getElementById("title"),contentEl=document.getElementById("content"),idEl=document.getElementById("noteId");

let notes=[];
let view={x:0,y:0,scale:1};
let drag=null;
let saveTimer=null;
let moving=false;
let remotePositions=new Map();
let broadcastChannel=null;

function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px";ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);draw()}
addEventListener("resize",resize); resize();

function worldFromScreen(x,y){return{x:(x-view.x)/view.scale,y:(y-view.y)/view.scale}}
function screenFromWorld(x,y){return{x:x*view.scale+view.x,y:y*view.scale+view.y}}

function noteSize(n){
  const w=270,h=170;
  return {w,h};
}
function draw(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  ctx.save();
  ctx.translate(view.x,view.y);ctx.scale(view.scale,view.scale);
  for(const n of notes) drawNote(n);
  ctx.restore();
}
function roundRect(c,x,y,w,h,r){
  c.beginPath();c.roundRect(x,y,w,h,r);c.fill();c.stroke();
}
function drawNote(n){
  const {w,h}=noteSize(n),x=n.x,y=n.y;
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,.11)";ctx.shadowBlur=12;ctx.shadowOffsetY=5;
  ctx.fillStyle="#fffdf0";ctx.strokeStyle="rgba(0,0,0,.12)";ctx.lineWidth=1;
  roundRect(ctx,x,y,w,h,14);
  ctx.shadowColor="transparent";
  ctx.fillStyle="#111";ctx.font="700 17px system-ui";
  ctx.fillText(n.title||"Untitled",x+16,y+27);
  ctx.fillStyle="#555";ctx.font="14px system-ui";
  wrapText(n.content||"",x+16,y+52,w-32,20,5);
  ctx.fillStyle="#999";ctx.font="11px system-ui";
  ctx.fillText(new Date(n.updated_at||n.created_at).toLocaleString(),x+16,y+h-13);
  ctx.restore();
}
function wrapText(text,x,y,maxWidth,lineHeight,maxLines){
  const words=text.split(/\s+/),lines=[];let line="";
  for(const word of words){
    const test=line?line+" "+word:word;
    if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word}else line=test;
  }
  if(line)lines.push(line);
  lines.slice(0,maxLines).forEach((l,i)=>ctx.fillText(l,x,y+i*lineHeight));
}

function noteAt(sx,sy){
  const p=worldFromScreen(sx,sy);
  for(let i=notes.length-1;i>=0;i--){
    const n=notes[i],{w,h}=noteSize(n);
    if(p.x>=n.x&&p.x<=n.x+w&&p.y>=n.y&&p.y<=n.y+h)return n;
  }
  return null;
}
function pointer(e){return{x:e.clientX,y:e.clientY}}

canvas.addEventListener("pointerdown",e=>{
  const p=pointer(e),n=noteAt(p.x,p.y);
  canvas.setPointerCapture(e.pointerId);
  if(n){
    drag={type:"note",note:n,start:p,ox:n.x,oy:n.y};
    moving=true;canvas.classList.add("dragging");
  }else{
    drag={type:"pan",start:p,ox:view.x,oy:view.y};
    canvas.classList.add("dragging");
  }
});
canvas.addEventListener("pointermove",e=>{
  if(!drag)return;
  const p=pointer(e),dx=p.x-drag.start.x,dy=p.y-drag.start.y;
  if(drag.type==="pan"){view.x=drag.ox+dx;view.y=drag.oy+dy}
  else{
    drag.note.x=drag.ox+dx/view.scale;
    drag.note.y=drag.oy+dy/view.scale;
    broadcastPosition(drag.note);
    draw();
  }
  draw();
});
canvas.addEventListener("pointerup",()=>{
  if(drag?.type==="note")savePosition(drag.note);
  drag=null;moving=false;canvas.classList.remove("dragging");
});
canvas.addEventListener("pointercancel",()=>{drag=null;canvas.classList.remove("dragging")});
canvas.addEventListener("dblclick",e=>{
  const p=worldFromScreen(e.clientX,e.clientY);
  openNew(p.x-135,p.y-85);
});
canvas.addEventListener("wheel",e=>{
  e.preventDefault();
  const before=worldFromScreen(e.clientX,e.clientY);
  const factor=e.deltaY<0?1.1:.9;
  view.scale=Math.min(2.5,Math.max(.35,view.scale*factor));
  const after=worldFromScreen(e.clientX,e.clientY);
  view.x+=(after.x-before.x)*view.scale;
  view.y+=(after.y-before.y)*view.scale;
  draw();
},{passive:false});

function broadcastPosition(n){
  if(!broadcastChannel) return;
  broadcastChannel.send({
    type:"broadcast",
    event:"note-move",
    payload:{id:n.id,x:n.x,y:n.y}
  }).catch(()=>{});
}

async function savePosition(n){
  // Persist only after the user releases the note.
  const {error}=await db.from("notes")
    .update({x:n.x,y:n.y})
    .eq("id",n.id);
  if(error) console.error("position save",error);
}
function setStatus(t,live){statusText.textContent=t;status.className="status"+(live?" live":"")}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1800)}

function openNew(x=80,y=100){
  idEl.value="";titleEl.value="";contentEl.value="";
  modal.dataset.x=x;modal.dataset.y=y;
  document.getElementById("modalTitle").textContent="New note";
  modal.classList.add("show");setTimeout(()=>titleEl.focus(),50);
}
function openEdit(n){
  idEl.value=n.id;titleEl.value=n.title||"";contentEl.value=n.content||"";
  modal.dataset.x=n.x;modal.dataset.y=n.y;
  document.getElementById("modalTitle").textContent="Edit note";
  modal.classList.add("show");setTimeout(()=>titleEl.focus(),50);
}
function close(){modal.classList.remove("show")}
document.getElementById("addBtn").onclick=()=>openNew(80-view.x/view.scale,80-view.y/view.scale);
document.getElementById("cancel").onclick=close;
modal.onclick=e=>{if(e.target===modal)close()};
document.getElementById("resetBtn").onclick=()=>{view={x:0,y:0,scale:1};draw()};

form.onsubmit=async e=>{
  e.preventDefault();
  const title=titleEl.value.trim(),content=contentEl.value.trim(),id=idEl.value;
  if(!title||!content)return;
  let result;
  if(id){
    result=await db.from("notes").update({title,content}).eq("id",id).select().single();
  }else{
    result=await db.from("notes").insert({title,content,x:Number(modal.dataset.x),y:Number(modal.dataset.y)}).select().single();
  }
  if(result.error){toast(result.error.message);return}
  close();toast(id?"Updated":"Created");await load();
};

canvas.addEventListener("dblclick",e=>{
  const n=noteAt(e.clientX,e.clientY);
  if(n)openEdit(n);
});
canvas.addEventListener("contextmenu",async e=>{
  e.preventDefault();
  const n=noteAt(e.clientX,e.clientY);
  if(n&&confirm("Delete this note?")){
    const {error}=await db.from("notes").delete().eq("id",n.id);
    if(error)toast(error.message);else{toast("Deleted");load()}
  }
});

// One realtime channel handles BOTH persistent database changes and
// ultra-fast transient note movement. Dragging never triggers a database
// read or full canvas reload.
broadcastChannel = db.channel("canvas-notes-live", {
  config: { broadcast: { self: false } }
});

broadcastChannel
.on("broadcast", { event:"note-move" }, ({payload})=>{
  const n=notes.find(n=>n.id===payload.id);
  if(!n) return;
  n.x=payload.x;
  n.y=payload.y;
  remotePositions.set(n.id, {x:n.x,y:n.y});
  draw();
})
.on("postgres_changes",{event:"INSERT",schema:"public",table:"notes"},payload=>{
  const incoming=payload.new;
  if(!notes.some(n=>n.id===incoming.id)){
    notes.unshift(incoming);
    draw();
  }
})
.on("postgres_changes",{event:"UPDATE",schema:"public",table:"notes"},payload=>{
  const incoming=payload.new;
  const n=notes.find(n=>n.id===incoming.id);
  if(!n){ notes.unshift(incoming); draw(); return; }

  // Don't overwrite the local note while its owner is actively dragging.
  if(drag?.type==="note" && drag.note.id===incoming.id) return;

  Object.assign(n,incoming);
  draw();
})
.on("postgres_changes",{event:"DELETE",schema:"public",table:"notes"},payload=>{
  notes=notes.filter(n=>n.id!==payload.old.id);
  draw();
})
.subscribe(s=>{
  if(s==="SUBSCRIBED")setStatus("Live",true);
  else if(s==="CHANNEL_ERROR"||s==="TIMED_OUT")setStatus("Realtime offline",false);
});

load();
</script>
</div>
</body>
</html>
